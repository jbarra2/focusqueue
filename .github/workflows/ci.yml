name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Read-only token, and no secrets anywhere in this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # better-sqlite3 ships a prebuilt binary for Linux, so no dependency script needs to run.
      # Skipping them avoids a slow native build and runs no third-party install code in CI.
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run build
